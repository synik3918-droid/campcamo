<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>캠프카모 챗</title>
  <style>
    :root{
      --bg:#0b0d12; --panel:#171a21; --side:#12151b; --line:#262b36;
      --me:#3b82f6; --you:#2a2f3a; --text:#e7eaf0; --sub:#8b93a3;
      --accent:#4ade80;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
                  "Malgun Gothic",sans-serif;
      display:flex; justify-content:center;
    }
    /* 기본(모바일): 단일 컬럼 */
    #app{
      width:100%; max-width:520px; height:100dvh;
      display:flex; flex-direction:column; background:var(--panel);
      border-left:1px solid var(--line); border-right:1px solid var(--line);
    }
    /* 사이드바 (데스크톱 전용) */
    #sidebar{ display:none; }
    header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--line);
      background:var(--panel); position:sticky; top:0; z-index:2;
    }
    header .title{font-weight:700; font-size:16px}
    header .sub{font-size:12px; color:var(--sub); margin-top:2px}
    .ghost-btn{
      background:transparent; color:var(--sub); border:1px solid var(--line);
      border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
    }
    .ghost-btn:hover{color:var(--text); border-color:var(--sub)}
    /* 중앙 뷰(로그인/거부) */
    .center{
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; padding:24px; text-align:center;
    }
    .center h1{font-size:22px; margin:0}
    .center p{color:var(--sub); margin:0; line-height:1.6; font-size:14px}
    .gbtn{
      display:inline-flex; align-items:center; gap:10px; cursor:pointer;
      background:#fff; color:#111; border:none; border-radius:10px;
      padding:12px 18px; font-size:15px; font-weight:600;
    }
    .gbtn img{width:18px;height:18px}
    /* 채팅 컬럼 */
    #chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
    /* 메시지 */
    #messages{
      flex:1; overflow-y:auto; padding:16px; display:flex;
      flex-direction:column; gap:10px;
    }
    .row{display:flex; flex-direction:column; max-width:76%}
    .row.me{align-self:flex-end; align-items:flex-end}
    .row.you{align-self:flex-start; align-items:flex-start}
    .name{font-size:11px; color:var(--sub); margin:0 4px 3px}
    .bubble{
      padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.45;
      white-space:pre-wrap; word-break:break-word;
    }
    .me .bubble{background:var(--me); color:#fff; border-bottom-right-radius:5px}
    .you .bubble{background:var(--you); color:var(--text); border-bottom-left-radius:5px}
    .time{font-size:10px; color:var(--sub); margin:3px 4px 0}
    .daysep{align-self:center; color:var(--sub); font-size:11px; margin:8px 0}
    /* 입력창 */
    #composer{
      display:flex; gap:8px; padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      border-top:1px solid var(--line); background:var(--panel);
    }
    #composer .composer-inner{ display:flex; gap:8px; width:100%; }
    #msg-input{
      flex:1; background:var(--bg); color:var(--text); border:1px solid var(--line);
      border-radius:22px; padding:11px 16px; font-size:15px; outline:none;
    }
    #msg-input:focus{border-color:var(--me)}
    #send-btn{
      background:var(--me); color:#fff; border:none; border-radius:22px;
      padding:0 20px; font-size:15px; font-weight:600; cursor:pointer;
    }
    #send-btn:disabled{opacity:.4; cursor:default}
    [hidden]{display:none !important}

    /* ───────── 데스크톱 (≥900px): 사이드바 + 넓은 대화영역 ───────── */
    @media (min-width:900px){
      body{ background:var(--bg); }
      #app{
        max-width:1280px; width:100%; height:100dvh;
        flex-direction:row; border:1px solid var(--line);
      }
      /* 모바일 헤더 숨김 */
      #mobile-header{ display:none; }
      /* 사이드바 표시 */
      #sidebar:not([hidden]){
        display:flex; flex-direction:column; width:280px; flex:0 0 280px;
        background:var(--side); border-right:1px solid var(--line); padding:22px 20px;
      }
      #sidebar .brand{ font-size:18px; font-weight:800; letter-spacing:-.2px; }
      #sidebar .brand small{ display:block; color:var(--sub); font-size:12px; font-weight:500; margin-top:4px; }
      #sidebar .peer-card{
        margin-top:22px; padding:14px; background:var(--panel);
        border:1px solid var(--line); border-radius:12px;
      }
      #sidebar .peer-card .label{ font-size:11px; color:var(--sub); }
      #sidebar .peer-card .peer{ font-size:14px; font-weight:600; margin-top:5px; word-break:break-all; }
      #sidebar .peer-card .me{ font-size:12px; color:var(--sub); margin-top:8px; word-break:break-all; }
      #sidebar .spacer{ flex:1; }
      #sidebar .side-logout{ width:100%; padding:10px; }
      /* 대화영역: 860px 컬럼을 가운데로(좌우 패딩), 말풍선 좌/우 정렬은 유지 */
      #messages{ padding:24px max(24px, (100% - 860px) / 2); }
      .row{ max-width:min(70%, 600px); }
      #composer{ padding:16px 0 calc(16px + env(safe-area-inset-bottom)); }
      #composer .composer-inner{ max-width:860px; margin:0 auto; padding:0 24px; }
      .center{ padding:40px; }
      .center h1{ font-size:26px; }
    }
    /* 초광폭에서 너무 벌어지지 않게 이미 max-width로 제한됨 */
  </style>
</head>
<body>
  <div id="app">

    <!-- 데스크톱 사이드바 -->
    <aside id="sidebar" hidden>
      <div class="brand">캠프카모 챗<small>1:1 실시간 대화</small></div>
      <div class="peer-card">
        <div class="label">대화 상대</div>
        <div class="peer" id="side-peer">—</div>
        <div class="me" id="side-me">—</div>
      </div>
      <div class="spacer"></div>
      <button class="ghost-btn side-logout" id="logout-btn-2">로그아웃</button>
    </aside>

    <!-- 채팅 컬럼 -->
    <div id="chat-col">
      <!-- 모바일 헤더 -->
      <header id="mobile-header">
        <div>
          <div class="title">캠프카모 챗</div>
          <div class="sub" id="header-sub">1:1 대화</div>
        </div>
        <button class="ghost-btn" id="logout-btn" hidden>로그아웃</button>
      </header>

      <!-- 로그인 전 -->
      <div class="center" id="login-view">
        <h1>👋 어서오세요</h1>
        <p>구글 계정으로 로그인하면<br/>대화를 시작할 수 있어요.</p>
        <button class="gbtn" id="login-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""/>
          구글로 로그인
        </button>
      </div>

      <!-- 허용되지 않은 계정 -->
      <div class="center" id="denied-view" hidden>
        <h1>🔒 접근 권한이 없어요</h1>
        <p id="denied-msg">이 대화는 지정된 두 사람만 볼 수 있어요.</p>
        <button class="gbtn" id="denied-logout" style="background:#2a2f3a;color:#fff">다른 계정으로</button>
      </div>

      <!-- 채팅 -->
      <div id="messages" hidden></div>
      <form id="composer" hidden>
        <div class="composer-inner">
          <input id="msg-input" type="text" placeholder="메시지 입력…" autocomplete="off" maxlength="2000"/>
          <button id="send-btn" type="submit" disabled>전송</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig, ALLOWED_EMAILS, ROOM_ID } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const allow = ALLOWED_EMAILS.map(e => e.trim().toLowerCase());

    const $ = id => document.getElementById(id);
    const loginView=$("login-view"), deniedView=$("denied-view"), sidebar=$("sidebar");
    const messagesEl=$("messages"), composer=$("composer");
    const input=$("msg-input"), sendBtn=$("send-btn");
    const logoutBtn=$("logout-btn"), logoutBtn2=$("logout-btn-2"), headerSub=$("header-sub");

    let me=null, unsub=null;

    $("login-btn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert(e.message));
    const doLogout = () => signOut(auth);
    logoutBtn.onclick = doLogout;
    logoutBtn2.onclick = doLogout;
    $("denied-logout").onclick = doLogout;

    onAuthStateChanged(auth, user => {
      if (unsub) { unsub(); unsub=null; }
      if (!user) return showView("login");
      me = user;
      const email = (user.email||"").toLowerCase();
      if (!allow.includes(email)) {
        $("denied-msg").textContent = `${user.email} 계정은 이 대화에 초대되지 않았어요.`;
        return showView("denied");
      }
      headerSub.textContent = user.displayName ? `${user.displayName} 님으로 접속` : "1:1 대화";
      // 사이드바 정보
      const peer = ALLOWED_EMAILS.find(e => e.trim().toLowerCase() !== email) || "상대방";
      $("side-peer").textContent = peer;
      $("side-me").textContent = `나: ${user.displayName || user.email}`;
      showView("chat");
      subscribe();
    });

    function showView(v){
      loginView.hidden = v!=="login";
      deniedView.hidden = v!=="denied";
      messagesEl.hidden = v!=="chat";
      composer.hidden = v!=="chat";
      logoutBtn.hidden = v!=="chat";
      sidebar.hidden = v!=="chat";
    }

    function subscribe(){
      const q = query(collection(db,"rooms",ROOM_ID,"messages"), orderBy("createdAt"), limit(300));
      unsub = onSnapshot(q, snap => {
        const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
        messagesEl.innerHTML = "";
        let lastDay = "";
        snap.forEach(doc => {
          const m = doc.data();
          const t = m.createdAt?.toDate ? m.createdAt.toDate() : null;
          const day = t ? t.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"}) : "";
          if (day && day!==lastDay){ addSep(day); lastDay=day; }
          addMsg(m, t);
        });
        if (atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
      }, err => console.error("구독 오류:", err));
    }

    function addSep(text){
      const d=document.createElement("div"); d.className="daysep"; d.textContent=text;
      messagesEl.appendChild(d);
    }
    function addMsg(m, t){
      const mine = (m.senderEmail||"").toLowerCase() === (me.email||"").toLowerCase();
      const row=document.createElement("div"); row.className="row "+(mine?"me":"you");
      if(!mine){ const n=document.createElement("div"); n.className="name"; n.textContent=m.senderName||m.senderEmail||"상대"; row.appendChild(n); }
      const b=document.createElement("div"); b.className="bubble"; b.textContent=m.text||""; row.appendChild(b);
      const time=document.createElement("div"); time.className="time";
      time.textContent = t ? t.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "전송 중…";
      row.appendChild(time);
      messagesEl.appendChild(row);
    }

    input.addEventListener("input", ()=> sendBtn.disabled = input.value.trim()==="");
    composer.addEventListener("submit", async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !me) return;
      input.value=""; sendBtn.disabled=true;
      try{
        await addDoc(collection(db,"rooms",ROOM_ID,"messages"), {
          text,
          senderEmail: me.email,
          senderName: me.displayName || me.email,
          createdAt: serverTimestamp(),
        });
      }catch(err){ alert("전송 실패: "+err.message); input.value=text; }
      input.focus();
    });
  </script>
</body>
</html>
