<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>캠프카모 챗</title>
  <style>
    :root{
      --bg:#0b0d12; --panel:#171a21; --side:#12151b; --line:#262b36;
      --me:#3b82f6; --you:#2a2f3a; --text:#e7eaf0; --sub:#8b93a3;
      --accent:#4ade80;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
                  "Malgun Gothic",sans-serif;
      display:flex; justify-content:center;
    }
    #app{
      width:100%; max-width:520px; height:100dvh;
      display:flex; flex-direction:column; background:var(--panel);
      border-left:1px solid var(--line); border-right:1px solid var(--line);
    }
    #sidebar{ display:none; }
    header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--line);
      background:var(--panel); position:sticky; top:0; z-index:2;
    }
    header .title{font-weight:700; font-size:16px}
    header .sub{font-size:12px; color:var(--sub); margin-top:2px}
    .ghost-btn{
      background:transparent; color:var(--sub); border:1px solid var(--line);
      border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
    }
    .ghost-btn:hover{color:var(--text); border-color:var(--sub)}
    .center{
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; padding:24px; text-align:center;
    }
    .center h1{font-size:22px; margin:0}
    .center p{color:var(--sub); margin:0; line-height:1.6; font-size:14px}
    .gbtn{
      display:inline-flex; align-items:center; gap:10px; cursor:pointer;
      background:#fff; color:#111; border:none; border-radius:10px;
      padding:12px 18px; font-size:15px; font-weight:600;
    }
    .gbtn img{width:18px;height:18px}
    #chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
    #messages{
      flex:1; overflow-y:auto; padding:16px; display:flex;
      flex-direction:column; gap:10px;
    }
    .row{display:flex; flex-direction:column; max-width:76%}
    .row.me{align-self:flex-end; align-items:flex-end}
    .row.you{align-self:flex-start; align-items:flex-start}
    .name{font-size:11px; color:var(--sub); margin:0 4px 3px}
    .bubble{
      padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.45;
      white-space:pre-wrap; word-break:break-word;
    }
    .me .bubble{background:var(--me); color:#fff; border-bottom-right-radius:5px}
    .you .bubble{background:var(--you); color:var(--text); border-bottom-left-radius:5px}
    .bubble.img-only{ padding:4px; background:transparent !important; }
    .bubble img{ display:block; max-width:min(260px,62vw); border-radius:12px; cursor:pointer; }
    .bubble .caption{ margin-top:6px; }
    .metaline{ display:flex; gap:6px; align-items:center; margin:3px 4px 0; }
    .time{font-size:10px; color:var(--sub)}
    .readmark{font-size:10px; color:var(--accent); font-weight:600}
    .readmark.unread{color:var(--sub); font-weight:400}
    .daysep{align-self:center; color:var(--sub); font-size:11px; margin:8px 0}
    #composer{
      display:flex; gap:8px; padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      border-top:1px solid var(--line); background:var(--panel);
    }
    #composer .composer-inner{ display:flex; gap:8px; width:100%; align-items:center; }
    #attach-btn{
      flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--sub);
      width:42px; height:42px; border-radius:50%; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    #attach-btn:hover{color:var(--text); border-color:var(--sub)}
    #attach-btn:disabled{opacity:.4; cursor:default}
    #msg-input{
      flex:1; background:var(--bg); color:var(--text); border:1px solid var(--line);
      border-radius:22px; padding:11px 16px; font-size:15px; outline:none;
    }
    #msg-input:focus{border-color:var(--me)}
    #send-btn{
      flex:0 0 auto; background:var(--me); color:#fff; border:none; border-radius:22px;
      padding:0 20px; height:42px; font-size:15px; font-weight:600; cursor:pointer;
    }
    #send-btn:disabled{opacity:.4; cursor:default}
    #upload-hint{
      font-size:12px; color:var(--sub); padding:0 16px 8px; display:none;
    }
    #upload-hint.show{display:block}
    [hidden]{display:none !important}

    @media (min-width:900px){
      body{ background:var(--bg); }
      #app{
        max-width:1280px; width:100%; height:100dvh;
        flex-direction:row; border:1px solid var(--line);
      }
      #mobile-header{ display:none; }
      #sidebar:not([hidden]){
        display:flex; flex-direction:column; width:280px; flex:0 0 280px;
        background:var(--side); border-right:1px solid var(--line); padding:22px 20px;
      }
      #sidebar .brand{ font-size:18px; font-weight:800; letter-spacing:-.2px; }
      #sidebar .brand small{ display:block; color:var(--sub); font-size:12px; font-weight:500; margin-top:4px; }
      #sidebar .peer-card{
        margin-top:22px; padding:14px; background:var(--panel);
        border:1px solid var(--line); border-radius:12px;
      }
      #sidebar .peer-card .label{ font-size:11px; color:var(--sub); }
      #sidebar .peer-card .peer{ font-size:14px; font-weight:600; margin-top:5px; word-break:break-all; }
      #sidebar .peer-card .me{ font-size:12px; color:var(--sub); margin-top:8px; word-break:break-all; }
      #sidebar .spacer{ flex:1; }
      #sidebar .side-logout{ width:100%; padding:10px; }
      #messages{ padding:24px max(24px, (100% - 860px) / 2); }
      .row{ max-width:min(70%, 600px); }
      #composer{ padding:16px 0 calc(16px + env(safe-area-inset-bottom)); }
      #composer .composer-inner{ max-width:860px; margin:0 auto; padding:0 24px; }
      #upload-hint{ max-width:860px; margin:0 auto; }
      .center{ padding:40px; }
      .center h1{ font-size:26px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" hidden>
      <div class="brand">캠프카모 챗<small>1:1 실시간 대화</small></div>
      <div class="peer-card">
        <div class="label">대화 상대</div>
        <div class="peer" id="side-peer">—</div>
        <div class="me" id="side-me">—</div>
      </div>
      <div class="spacer"></div>
      <button class="ghost-btn side-logout" id="logout-btn-2">로그아웃</button>
    </aside>

    <div id="chat-col">
      <header id="mobile-header">
        <div>
          <div class="title">캠프카모 챗</div>
          <div class="sub" id="header-sub">1:1 대화</div>
        </div>
        <button class="ghost-btn" id="logout-btn" hidden>로그아웃</button>
      </header>

      <div class="center" id="login-view">
        <h1>👋 어서오세요</h1>
        <p>구글 계정으로 로그인하면<br/>대화를 시작할 수 있어요.</p>
        <button class="gbtn" id="login-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""/>
          구글로 로그인
        </button>
      </div>

      <div class="center" id="denied-view" hidden>
        <h1>🔒 접근 권한이 없어요</h1>
        <p id="denied-msg">이 대화는 지정된 두 사람만 볼 수 있어요.</p>
        <button class="gbtn" id="denied-logout" style="background:#2a2f3a;color:#fff">다른 계정으로</button>
      </div>

      <div id="messages" hidden></div>
      <div id="upload-hint">🖼️ 이미지 업로드 중…</div>
      <form id="composer" hidden>
        <div class="composer-inner">
          <button type="button" id="attach-btn" title="이미지 첨부">＋</button>
          <input id="file-input" type="file" accept="image/*" hidden />
          <input id="msg-input" type="text" placeholder="메시지 입력…" autocomplete="off" maxlength="2000"/>
          <button id="send-btn" type="submit" disabled>전송</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref as sref, uploadBytes, getDownloadURL }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
    import { firebaseConfig, ALLOWED_EMAILS, ROOM_ID } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const allow = ALLOWED_EMAILS.map(e => e.trim().toLowerCase());

    const $ = id => document.getElementById(id);
    const loginView=$("login-view"), deniedView=$("denied-view"), sidebar=$("sidebar");
    const messagesEl=$("messages"), composer=$("composer");
    const input=$("msg-input"), sendBtn=$("send-btn");
    const attachBtn=$("attach-btn"), fileInput=$("file-input"), uploadHint=$("upload-hint");
    const logoutBtn=$("logout-btn"), logoutBtn2=$("logout-btn-2"), headerSub=$("header-sub");

    let me=null, unsubMsgs=null, unsubPeer=null;
    let msgs=[], peerReadAt=null, myReadRef=null, lastMarkedTs=0;
    const keyOf = email => email.trim().toLowerCase().replace(/[.@]/g,"_");

    $("login-btn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert(e.message));
    const doLogout = () => signOut(auth);
    logoutBtn.onclick = doLogout; logoutBtn2.onclick = doLogout;
    $("denied-logout").onclick = doLogout;

    onAuthStateChanged(auth, user => {
      if (unsubMsgs){ unsubMsgs(); unsubMsgs=null; }
      if (unsubPeer){ unsubPeer(); unsubPeer=null; }
      msgs=[]; peerReadAt=null; lastMarkedTs=0;
      if (!user) return showView("login");
      me = user;
      const email = (user.email||"").toLowerCase();
      if (!allow.includes(email)) {
        $("denied-msg").textContent = `${user.email} 계정은 이 대화에 초대되지 않았어요.`;
        return showView("denied");
      }
      headerSub.textContent = user.displayName ? `${user.displayName} 님으로 접속` : "1:1 대화";
      const peer = ALLOWED_EMAILS.find(e => e.trim().toLowerCase() !== email) || "상대방";
      $("side-peer").textContent = peer;
      $("side-me").textContent = `나: ${user.displayName || user.email}`;
      showView("chat");
      start(email, peer);
    });

    function showView(v){
      loginView.hidden = v!=="login";
      deniedView.hidden = v!=="denied";
      messagesEl.hidden = v!=="chat";
      composer.hidden = v!=="chat";
      logoutBtn.hidden = v!=="chat";
      sidebar.hidden = v!=="chat";
    }

    function start(myEmail, peerEmail){
      myReadRef = doc(db,"rooms",ROOM_ID,"reads",keyOf(myEmail));
      // 상대의 '읽음' 상태 구독
      unsubPeer = onSnapshot(doc(db,"rooms",ROOM_ID,"reads",keyOf(peerEmail)), snap=>{
        const d = snap.data();
        peerReadAt = d?.at?.toDate ? d.at.toDate() : null;
        render();
      }, e=>console.error("read 구독 오류:",e));
      // 메시지 구독
      const q = query(collection(db,"rooms",ROOM_ID,"messages"), orderBy("createdAt"), limit(300));
      unsubMsgs = onSnapshot(q, snap=>{
        msgs = snap.docs.map(d=>d.data());
        render();
        markRead();   // 새 메시지 보면 내 읽음 갱신
      }, e=>console.error("메시지 구독 오류:",e));
    }

    // 내 '읽음' 시각을 최신 메시지 시각으로 갱신(상대에게 '읽음' 표시)
    async function markRead(){
      const last = msgs[msgs.length-1];
      const t = last?.createdAt?.toDate ? last.createdAt.toDate().getTime() : 0;
      if (!myReadRef || !t || t<=lastMarkedTs) return;
      lastMarkedTs = t;
      try{ await setDoc(myReadRef,{ email:me.email, at:serverTimestamp() },{merge:true}); }
      catch(e){ console.error("읽음 갱신 오류:",e); }
    }

    function render(){
      const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 140;
      messagesEl.innerHTML=""; let lastDay="";
      // 내 마지막 메시지 인덱스(읽음표시용)
      let lastMineIdx=-1;
      msgs.forEach((m,i)=>{ if((m.senderEmail||"").toLowerCase()===(me.email||"").toLowerCase()) lastMineIdx=i; });
      msgs.forEach((m,i)=>{
        const t = m.createdAt?.toDate ? m.createdAt.toDate() : null;
        const day = t ? t.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"}) : "";
        if (day && day!==lastDay){ addSep(day); lastDay=day; }
        addMsg(m,t,i===lastMineIdx);
      });
      if (atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSep(text){
      const d=document.createElement("div"); d.className="daysep"; d.textContent=text; messagesEl.appendChild(d);
    }
    function addMsg(m,t,isMyLast){
      const mine = (m.senderEmail||"").toLowerCase()===(me.email||"").toLowerCase();
      const row=document.createElement("div"); row.className="row "+(mine?"me":"you");
      if(!mine){ const n=document.createElement("div"); n.className="name"; n.textContent=m.senderName||m.senderEmail||"상대"; row.appendChild(n); }
      const b=document.createElement("div"); b.className="bubble";
      if(m.imageUrl){
        const img=document.createElement("img"); img.src=m.imageUrl; img.loading="lazy";
        img.onclick=()=>window.open(m.imageUrl,"_blank");
        if(m.text){ b.appendChild(img); const c=document.createElement("div"); c.className="caption"; c.textContent=m.text; b.appendChild(c); }
        else { b.classList.add("img-only"); b.appendChild(img); }
      } else { b.textContent=m.text||""; }
      row.appendChild(b);

      const meta=document.createElement("div"); meta.className="metaline";
      const time=document.createElement("span"); time.className="time";
      time.textContent = t ? t.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "전송 중…";
      // 읽음 표시: 내 마지막 메시지에만
      if(mine && isMyLast && t){
        const read = peerReadAt && peerReadAt.getTime() >= t.getTime();
        const rm=document.createElement("span"); rm.className="readmark"+(read?"":" unread");
        rm.textContent = read ? "읽음" : "안읽음";
        meta.appendChild(rm);
      }
      meta.appendChild(time);
      row.appendChild(meta);
      messagesEl.appendChild(row);
    }

    // 텍스트 전송
    input.addEventListener("input", ()=> sendBtn.disabled = input.value.trim()==="");
    composer.addEventListener("submit", async e=>{
      e.preventDefault();
      const text=input.value.trim(); if(!text||!me) return;
      input.value=""; sendBtn.disabled=true;
      try{
        await addDoc(collection(db,"rooms",ROOM_ID,"messages"),{
          text, senderEmail:me.email, senderName:me.displayName||me.email, createdAt:serverTimestamp()
        });
      }catch(err){ alert("전송 실패: "+err.message); input.value=text; }
      input.focus();
    });

    // 이미지 전송
    attachBtn.onclick = ()=> fileInput.click();
    fileInput.addEventListener("change", async e=>{
      const file=e.target.files[0]; e.target.value="";
      if(!file||!me) return;
      if(!file.type.startsWith("image/")){ alert("이미지 파일만 보낼 수 있어요."); return; }
      if(file.size > 10*1024*1024){ alert("이미지는 10MB 이하만 가능해요."); return; }
      uploadHint.classList.add("show"); attachBtn.disabled=true;
      try{
        const safe = file.name.replace(/[^\w.\-]/g,"_");
        const path = `rooms/${ROOM_ID}/${Date.now()}_${safe}`;
        const r = sref(storage, path);
        await uploadBytes(r, file);
        const url = await getDownloadURL(r);
        await addDoc(collection(db,"rooms",ROOM_ID,"messages"),{
          imageUrl:url, senderEmail:me.email, senderName:me.displayName||me.email, createdAt:serverTimestamp()
        });
      }catch(err){ alert("이미지 전송 실패: "+err.message); }
      uploadHint.classList.remove("show"); attachBtn.disabled=false;
    });
  </script>
</body>
</html>
